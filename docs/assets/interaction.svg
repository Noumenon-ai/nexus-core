<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="540" fill="#ffffff"/>
  <style>
    .u{fill:#f2f2f0;stroke:#e0e0dd;stroke-width:1;}
    .a{fill:#ffffff;stroke:#111111;stroke-width:1.3;}
    .ut{fill:#111111;font-size:15px;}
    .at{fill:#111111;font-size:15px;}
    .lab{fill:#8a8a8a;font-size:11px;font-family:DejaVu Sans Mono,monospace;}
    .btn{fill:#ffffff;stroke:#111111;stroke-width:1.2;}
    .btnt{fill:#111111;font-size:13px;font-family:DejaVu Sans Mono,monospace;}
  </style>
  <text x="28" y="38" class="lab">EXAMPLE INTERACTION (illustrative)</text>

  <rect x="300" y="56" width="432" height="40" rx="8" class="u"/>
  <text x="320" y="81" class="ut">remind me to call the bank tomorrow at 9am</text>
  <text x="724" y="110" class="lab" text-anchor="end">you</text>

  <rect x="28" y="120" width="470" height="40" rx="8" class="a"/>
  <text x="44" y="145" class="at">Done. Reminder set for tomorrow, 9:00 AM: call the bank.</text>
  <text x="44" y="174" class="lab">nexus</text>

  <rect x="380" y="188" width="352" height="40" rx="8" class="u"/>
  <text x="400" y="213" class="ut">actually make it 10 - wait, 11</text>
  <text x="724" y="242" class="lab" text-anchor="end">you</text>

  <rect x="28" y="252" width="372" height="62" rx="8" class="a"/>
  <text x="44" y="277" class="at">Updated.</text>
  <text x="44" y="299" class="at" font-family="DejaVu Sans Mono,monospace" font-size="13">Corrected time: 10:00 AM -> 11:00 AM</text>
  <text x="44" y="332" class="lab">nexus · self-correction</text>

  <rect x="430" y="346" width="302" height="40" rx="8" class="u"/>
  <text x="450" y="371" class="ut">delete all my reminders</text>
  <text x="724" y="400" class="lab" text-anchor="end">you</text>

  <rect x="28" y="410" width="500" height="92" rx="8" class="a"/>
  <text x="44" y="436" class="at">This will permanently delete 12 reminders.</text>
  <text x="44" y="458" class="at" fill="#6b6b6b" font-size="14">Destructive action - needs your approval.</text>
  <rect x="44" y="468" width="108" height="26" rx="5" class="btn"/>
  <text x="98" y="486" class="btnt" text-anchor="middle">Approve</text>
  <rect x="164" y="468" width="92" height="26" rx="5" class="btn"/>
  <text x="210" y="486" class="btnt" text-anchor="middle" fill="#6b6b6b">Cancel</text>
  <text x="44" y="518" class="lab">nexus · approval gate</text>
</svg>
