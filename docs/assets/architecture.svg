  <path class="ar" d="M150 328 L150 392" marker-end="url(#a)"/>
  <path class="ar" d="M430 328 L430 392" marker-end="url(#a)"/>
  <path class="ar" d="M740 328 L740 392" marker-end="url(#a)"/>

